# Lab 9 solution — AI issue triage with GitHub Models.
# Copy to .github/workflows/issue-triage.yml
#
# On every new issue: ask a model (via the built-in GitHub Models inference
# endpoint — no API key, just the `models: read` permission) which labels fit,
# then apply them and leave a short explanatory comment.
#
# SECURITY NOTE ▸ the issue title/body are UNTRUSTED INPUT. They go into the
# prompt as data via templating — never into shell commands or expressions —
# and the model's output is constrained to an enum via a JSON schema, so a
# malicious issue can't make this workflow do anything except mislabel itself.
name: AI Issue Triage

on:
  issues:
    types: [opened]

permissions:
  contents: read # read prompts/ from the repo
  issues: write # apply labels + comment
  models: read # call GitHub Models inference

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Classify issue with GitHub Models
        id: ai
        uses: actions/ai-inference@a7805884c80886efc241e94a5351df715968a0ad # v2.1.1
        with:
          prompt-file: ./prompts/issue-triage.prompt.yml
          # Issue text is passed as template variables — data, not instructions.
          input: |
            title: ${{ toJSON(github.event.issue.title) }}
            body: ${{ toJSON(github.event.issue.body) }}

      - name: Apply labels and comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
        with:
          script: |
            const allowed = new Set(["bug", "enhancement", "question", "documentation"]);
            let result;
            try {
              result = JSON.parse(process.env.AI_RESPONSE);
            } catch (error) {
              core.warning(`Model returned non-JSON output; skipping triage. ${error}`);
              return;
            }
            // Trust nothing: re-validate the model output before acting on it.
            const labels = (result.labels ?? []).filter((l) => allowed.has(l));
            if (labels.length === 0) {
              core.notice("Model suggested no valid labels; leaving issue untouched.");
              return;
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels,
            });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                `🤖 Auto-triage suggested label(s): ${labels.map((l) => `\`${l}\``).join(", ")}`,
                "",
                `> ${result.reason ?? "(no rationale returned)"}`,
                "",
                "_Suggested by GitHub Models in Actions — a human should confirm._",
              ].join("\n"),
            });
